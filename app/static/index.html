<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QueryBase · Java 面试知识库</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ============ 设计基调 ============
   概念:「示波器 / 信号分析」—— 深夜工程台
   黑墨蓝底 + 示波器青绿荧光 + 等宽字体仪器感
   记忆点:回答后的「来源波形卡」—— 每条来源是一条可展开的信号曲线
   ================================ */
:root {
  --bg: #070b12;
  --bg-2: #0b111c;
  --panel: #0e1524;
  --line: rgba(94, 234, 212, 0.12);
  --line-strong: rgba(94, 234, 212, 0.28);
  --ink: #e6edf3;
  --ink-dim: #8b98ab;
  --ink-faint: #4d5a6e;
  --signal: #5eead4;          /* 示波器青绿 */
  --signal-2: #34d399;
  --signal-dim: rgba(94, 234, 212, 0.08);
  --amber: #ffb454;           /* 仪表警告橙(点缀) */
  --danger: #f87171;
  --radius: 14px;
  --mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  overflow: hidden;
}
/* 网格底纹 + 角部光晕 */
.bg-grid {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(1200px 500px at 85% -10%, rgba(94, 234, 212, 0.07), transparent 60%),
    radial-gradient(900px 400px at -10% 110%, rgba(255, 180, 84, 0.05), transparent 60%),
    linear-gradient(rgba(94, 234, 212, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(94, 234, 212, 0.03) 1px, transparent 1px);
  background-size: auto, auto, 36px 36px, 36px 36px;
  mask-image: radial-gradient(ellipse 90% 80% at 50% 40%, black 40%, transparent 100%);
}
/* ============ 布局 ============ */
.app { position: relative; z-index: 1; height: 100vh; display: flex; flex-direction: column; }
/* 顶栏 */
header {
  display: flex; align-items: center; gap: 14px;
  padding: 0 28px; height: 60px; flex-shrink: 0;
  border-bottom: 1px solid var(--line);
  background: rgba(7, 11, 18, 0.75); backdrop-filter: blur(8px);
}
.logo-mark {
  width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
  border: 1px solid var(--line-strong);
  background: var(--signal-dim);
  display: grid; place-items: center;
  font-family: var(--mono); font-weight: 700; font-size: 13px; color: var(--signal);
  box-shadow: 0 0 18px rgba(94, 234, 212, 0.15) inset;
}
header h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.4px; }
header h1 em { font-style: normal; color: var(--signal); }
.chips { display: flex; gap: 8px; margin-left: 8px; }
.chip {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.5px;
  color: var(--ink-dim); border: 1px solid var(--line);
  padding: 3px 9px; border-radius: 999px; background: transparent;
}
.stat {
  margin-left: auto; display: flex; align-items: center; gap: 7px;
  font-family: var(--mono); font-size: 11px; color: var(--ink-dim);
}
.stat .dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--signal-2);
  box-shadow: 0 0 8px rgba(52, 211, 153, 0.8); animation: pulse 2.2s infinite;
}
@keyframes pulse { 50% { opacity: 0.35; } }
/* 聊天区 */
main { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
main::-webkit-scrollbar { width: 8px; }
main::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 4px; }
.thread { max-width: 780px; margin: 0 auto; padding: 28px 24px 12px; }
/* 空状态 */
.empty { padding: 9vh 0 4vh; text-align: center; animation: rise .5s ease-out both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.empty .kicker {
  font-family: var(--mono); font-size: 11px; letter-spacing: 3px;
  color: var(--signal); text-transform: uppercase; margin-bottom: 14px;
}
.empty .big { font-size: 32px; font-weight: 900; line-height: 1.35; letter-spacing: 1px; }
.empty .big .grad {
  background: linear-gradient(100deg, var(--signal) 20%, #7dd3fc 80%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.empty .sub { margin-top: 10px; color: var(--ink-dim); font-size: 14px; }
.suggests {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
  margin: 34px auto 0; max-width: 720px;
}
.sug-card {
  text-align: left; padding: 14px 16px; cursor: pointer;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  font-family: var(--sans); font-size: 13px; color: var(--ink);
  line-height: 1.6; position: relative; overflow: hidden;
  transition: border-color .25s, transform .25s, box-shadow .25s;
}
.sug-card::before {
  content: ""; position: absolute; inset: 0 auto 0 0; width: 3px;
  background: var(--signal); opacity: 0; transition: opacity .25s;
}
.sug-card:hover {
  border-color: var(--line-strong); transform: translateY(-2px);
  box-shadow: 0 10px 30px -12px rgba(94, 234, 212, 0.18);
}
.sug-card:hover::before { opacity: 1; }
.sug-card .idx { font-family: var(--mono); font-size: 10px; color: var(--signal); display: block; margin-bottom: 6px; }
/* 消息 */
.msg { display: flex; gap: 12px; margin: 22px 0; animation: rise .35s ease-out both; }
.msg .avatar {
  width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
  display: grid; place-items: center; font-size: 12px; margin-top: 2px;
}
.msg.user .avatar { background: var(--signal-dim); border: 1px solid var(--line-strong); color: var(--signal); font-family: var(--mono); font-weight: 700; }
.msg.ai .avatar { background: rgba(255, 180, 84, 0.1); border: 1px solid rgba(255, 180, 84, 0.3); color: var(--amber); font-family: var(--mono); font-weight: 700; }
.bubble { flex: 1; min-width: 0; }
.msg.user .bubble {
  background: linear-gradient(135deg, rgba(94, 234, 212, 0.10), rgba(125, 211, 252, 0.07));
  border: 1px solid var(--line-strong);
  padding: 11px 16px; border-radius: 4px 16px 16px 16px;
  font-size: 14.5px; line-height: 1.75;
}
.msg.ai .bubble {
  background: var(--panel); border: 1px solid var(--line);
  padding: 16px 18px; border-radius: 4px 16px 16px 16px;
  font-size: 14.5px; line-height: 1.85; color: #dbe4ee;
}
.msg.ai .bubble::first-letter { }
.msg.ai .bubble strong { color: var(--signal-2); font-weight: 600; }
.msg.ai .bubble code, .msg.ai .bubble pre {
  font-family: var(--mono); font-size: 12.5px; background: rgba(94, 234, 212, 0.07);
  border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; color: #a7f3d0;
}
.msg.ai .bubble pre { display: block; padding: 10px 12px; overflow-x: auto; line-height: 1.6; margin: 8px 0; }
/* 来源卡:波形风格 */
.sources-wrap { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 10px; }
.src-toggle {
  font-family: var(--mono); font-size: 11px; color: var(--ink-dim); cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; transition: color .2s;
  background: none; border: none;
}
.src-toggle:hover { color: var(--signal); }
.src-toggle .arrow { display: inline-block; transition: transform .25s; }
.sources-wrap.open .arrow { transform: rotate(90deg); }
.src-list { display: none; margin-top: 10px; }
.sources-wrap.open .src-list { display: grid; gap: 8px; animation: rise .3s ease-out; }
.src-card {
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px;
  background: rgba(11, 17, 28, 0.7); cursor: pointer; position: relative;
  transition: border-color .2s, background .2s;
}
.src-card:hover { border-color: var(--line-strong); background: rgba(14, 21, 36, 0.9); }
.src-card .src-head { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; }
.src-card .src-idx { color: var(--signal); }
.src-card .src-file { color: var(--ink-faint); }
.src-card .src-title { font-size: 13px; font-weight: 700; margin-top: 5px; color: var(--ink); }
.src-card .src-snippet { font-size: 12px; color: var(--ink-dim); line-height: 1.6; margin-top: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
/* 等待打字动画 */
.typing { display: inline-flex; align-items: center; gap: 5px; padding: 4px 0; }
.typing i { width: 5px; height: 5px; border-radius: 50%; background: var(--signal); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; }
.typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .2; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
.thinking-line { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); margin-bottom: 10px; letter-spacing: .5px; }
/* 输入区 */
footer {
  flex-shrink: 0; padding: 14px 24px 18px;
  background: linear-gradient(transparent, var(--bg) 30%);
}
.input-shell {
  max-width: 780px; margin: 0 auto;
  display: flex; gap: 10px; align-items: flex-end;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 16px; padding: 8px 8px 8px 18px;
  transition: border-color .25s, box-shadow .25s;
  box-shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.8);
}
.input-shell:focus-within { border-color: var(--line-strong); box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.06), 0 20px 50px -20px rgba(0, 0, 0, 0.8); }
#q {
  flex: 1; background: none; border: none; outline: none; resize: none;
  color: var(--ink); font-family: var(--sans); font-size: 14.5px; line-height: 1.6;
  padding: 8px 0; max-height: 120px;
}
#q::placeholder { color: var(--ink-faint); }
#send {
  border: none; cursor: pointer; height: 40px; min-width: 86px;
  border-radius: 11px; background: var(--signal);
  color: #06231c; font-weight: 800; font-size: 14px; letter-spacing: 1px;
  transition: transform .15s, box-shadow .2s, opacity .2s;
  box-shadow: 0 6px 24px -8px rgba(94, 234, 212, 0.55);
}
#send:hover { transform: translateY(-1px); }
#send:active { transform: translateY(0); }
#send:disabled { opacity: 0.45; cursor: wait; box-shadow: none; }
.hint { max-width: 780px; margin: 8px auto 0; font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); letter-spacing: .4px; }
/* 错误提示 */
.error { color: var(--danger) !important; }
/* 响应式 */
@media (max-width: 720px) {
  .suggests { grid-template-columns: 1fr; }
  header { padding: 0 16px; }
  .chip, .stat .label { display: none; }
  .thread { padding: 20px 14px 8px; }
  .msg .avatar { display: none; }
  .empty .big { font-size: 24px; }
  footer { padding: 10px 12px 14px; }
}
</style>
</head>
<body>
<div class="bg-grid"></div>

<div class="app">
  <header>
    <div class="logo-mark">Q</div>
    <h1>QueryBase <em>·</em> Java 面试知识库</h1>
    <div class="chips">
      <span class="chip">RAG</span>
      <span class="chip">BM25</span>
      <span class="chip">BGE</span>
      <span class="chip">DeepSeek</span>
    </div>
    <div class="stat"><span class="dot"></span><span class="label" id="stat-docs">索引在线</span></div>
  </header>

  <main id="chat">
    <div class="thread" id="thread"></div>
  </main>

  <footer>
    <div class="input-shell">
      <textarea id="q" rows="1" placeholder="输入你的 Java 面试问题… ( Enter 发送 / Shift+Enter 换行 )" autocomplete="off"></textarea>
      <button id="send">发送</button>
    </div>
    <div class="hint">§ 回答基于知识库检索生成 · 点击来源卡片可查看原文片段</div>
  </footer>
</div>

<script>
const thread = document.getElementById('thread');
const input = document.getElementById('q');
const sendBtn = document.getElementById('send');
const SUGGESTS = [
  'Spring 事务什么时候会失效?',
  'HashMap 底层是怎么实现的?',
  '什么是缓存雪崩?',
];

function renderEmpty() {
  thread.innerHTML = `
    <div class="empty">
      <div class="kicker">▍Retrieval Augmented Generation</div>
      <div class="big">向你的 <span class="grad">Java 知识库</span><br>发起一次检索</div>
      <div class="sub" id="stat-sub">知识库 · 混合检索 · 回答带出处</div>
      <div class="suggests">
        ${SUGGESTS.map((s, i) => `<button class="sug-card"><span class="idx">Q${i + 1}</span>${s}</button>`).join('')}
      </div>
    </div>`;
  thread.querySelectorAll('.sug-card').forEach((el, i) => {
    el.onclick = () => send(SUGGESTS[i]);
  });
}

function scrollBottom() { chat.scrollTop = chat.scrollHeight; }

function addMsg(role, html) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
  wrap.innerHTML = `
    <div class="avatar">${role === 'user' ? 'U' : 'AI'}</div>
    <div class="bubble">${html}</div>`;
  thread.appendChild(wrap);
  scrollBottom();
  return wrap.querySelector('.bubble');
}

function renderSources(bubble, sources) {
  const wrap = document.createElement('div');
  wrap.className = 'sources-wrap';
  wrap.innerHTML = `
    <button class="src-toggle"><span class="arrow">▸</span> 查看 ${sources.length} 个参考来源</button>
    <div class="src-list">
      ${sources.map((s, i) => `
        <div class="src-card">
          <div class="src-head"><span class="src-idx">[REF ${i + 1}]</span><span class="src-file">${s.file || '知识库'}</span></div>
          <div class="src-title">${s.title || '未命名来源'}</div>
          <div class="src-snippet">${s.snippet || ''}</div>
        </div>`).join('')}
    </div>`;
  bubble.appendChild(wrap);
  const toggle = wrap.querySelector('.src-toggle');
  toggle.onclick = () => wrap.classList.toggle('open');
}

function markdownish(text) {
  // 极简渲染:加粗、代码块、行内代码、换行 —— 足够美观且不引入依赖
  const esc = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const codeBlocks = [];
  let t = esc.replace(/```([\s\S]*?)```/g, (_, c) => {
    codeBlocks.push('<pre>' + c.trim() + '</pre>'); return '\x00' + (codeBlocks.length - 1) + '\x00';
  });
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>')
       .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
       .replace(/^#{1,4}\s+(.+)$/gm, '<strong style="font-size:15px;display:block;margin:10px 0 4px;">$1</strong>')
       .replace(/^- (.+)$/gm, '• $1');
  t = t.replace(/\x00(\d+)\x00/g, (_, i) => codeBlocks[+i]);
  return t.replace(/\n/g, '<br>');
}

// ---------- 会话记忆 ----------
let sessionId = sessionStorage.getItem('rag_session') || null;

function renderConfidence(bubble, value) {
  // 置信度徽章:基于检索相似度,三档显示
  const pct = Math.round(value * 100);
  const level = value >= 0.5 ? ['高', 'var(--signal-2)'] : value >= 0.35 ? ['中', 'var(--amber)'] : ['低', 'var(--danger)'];
  const badge = document.createElement('div');
  badge.style.cssText = `display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;
    color:${level[1]};border:1px solid ${level[1]}55;border-radius:999px;padding:2px 10px;margin-bottom:10px;letter-spacing:.5px;`;
  badge.innerHTML = `置信度 ${pct}% · ${level[0]}`;
  bubble.prepend(badge);
}

async function restoreSession() {
  // 页面刷新后:恢复会话历史与消息记录
  if (!sessionId) return;
  try {
    const resp = await fetch('/api/session/' + sessionId);
    if (!resp.ok) { sessionStorage.removeItem('rag_session'); sessionId = null; return; }
    const data = await resp.json();
    if (!data.history || !data.history.length) return;
    thread.innerHTML = '';
    data.history.forEach((m, i) => {
      if (m.role === 'user') addMsg('user', esc(m.content));
      else addMsg('ai', `<div class="answer">${markdownish(m.content)}</div>`);
    });
  } catch (e) { /* 恢复失败不阻塞使用 */ }
}

async function send(question) {
  if (!question) return;
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;

  addMsg('user', esc(question));
  const bubble = addMsg('ai', `
    <div class="thinking-line">▍retrieving · ranking</div>
    <span class="typing"><i></i><i></i><i></i></span>
    <div class="answer"></div>`);
  const answerBox = bubble.querySelector('.answer');

  try {
    const resp = await fetch('/api/ask/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, top_k: 3, session_id: sessionId }),
    });
    if (!resp.ok) throw new Error(('HTTP ' + resp.status));
    if (!resp.body) throw new Error('当前浏览器不支持流式读取');

    // 流式读取 SSE
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let answerText = '';
    let firstDelta = true;
    let sources = null;
    let confShown = false;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      // 按 \n\n 切分 SSE 事件(可能跨 chunk,用缓冲拼接)
      let idx;
      while ((idx = buffer.indexOf('\n\n')) !== -1) {
        const raw = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        if (!raw.startsWith('data: ')) continue;
        let ev;
        try { ev = JSON.parse(raw.slice(6)); } catch { continue; }

        if (ev.type === 'session' && ev.session_id) {
          sessionId = ev.session_id;
          sessionStorage.setItem('rag_session', sessionId);
        } else if (ev.type === 'sources') {
          sources = ev.sources;
          const line = bubble.querySelector('.thinking-line');
          if (line) line.textContent = '▍generating · streaming';
          if (sources && sources.length) renderSources(bubble, sources);
        } else if (ev.type === 'confidence' && !confShown) {
          renderConfidence(bubble, ev.value);
          confShown = true;
        } else if (ev.type === 'delta') {
          if (firstDelta) {
            bubble.querySelector('.typing')?.remove();
            bubble.querySelector('.thinking-line')?.remove();
            firstDelta = false;
          }
          answerText += ev.content;
          answerBox.textContent = answerText;   // 打字机效果(纯文本,结束后统一美化)
          scrollBottom();
        } else if (ev.type === 'error') {
          throw new Error(ev.message);
        }
      }
    }

    // 流结束:统一渲染 markdown 样式(只重绘回答容器,来源面板保留)
    if (firstDelta) {
      answerBox.innerHTML = '<span class="error">✕ 未收到任何内容</span>';
    } else {
      answerBox.innerHTML = markdownish(answerText);
    }
  } catch (e) {
    bubble.innerHTML = `<span class="error">✕ 请求失败: ${esc(e.message)}</span>`;
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

sendBtn.onclick = () => send(input.value.trim());
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(input.value.trim()); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});
renderEmpty();
restoreSession();   // 刷新页面恢复多轮对话
input.focus();

// 动态拉取索引统计
fetch('/api/health').then(r => r.json()).then(d => {
  document.getElementById('stat-docs').textContent = `索引在线 · ${d.docs_in_index} docs`;
  const sub = document.getElementById('stat-sub');
  if (sub) sub.textContent = `${d.docs_in_index} 个知识块 · 混合检索 · 回答带出处`;
}).catch(() => {});
</script>
</body>
</html>
