<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java 面试知识库问答</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column;
    }
    header {
      padding: 16px 24px; background: #1e293b; border-bottom: 1px solid #334155;
      display: flex; align-items: center; gap: 12px;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    header .badge {
      font-size: 12px; color: #86efac; background: #14532d33; border: 1px solid #166534;
      padding: 2px 10px; border-radius: 999px;
    }
    #chat { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .msg { max-width: 75%; padding: 12px 16px; border-radius: 12px; line-height: 1.7; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; background: #2563eb; }
    .msg.assistant { align-self: flex-start; background: #1e293b; border: 1px solid #334155; }
    .msg .sources { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #475569; font-size: 12px; color: #94a3b8; }
    .msg .sources span { background: #334155; padding: 2px 8px; border-radius: 6px; margin-right: 6px; display: inline-block; margin-top: 4px; }
    .msg.loading { color: #94a3b8; }
    .typing::after { content: "…"; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    #input-bar {
      padding: 16px 24px; background: #1e293b; border-top: 1px solid #334155;
      display: flex; gap: 12px;
    }
    #input-bar input {
      flex: 1; padding: 12px 16px; border-radius: 10px; border: 1px solid #475569;
      background: #0f172a; color: #e2e8f0; font-size: 14px; outline: none;
    }
    #input-bar input:focus { border-color: #3b82f6; }
    #input-bar button {
      padding: 12px 28px; border-radius: 10px; border: none; background: #2563eb;
      color: #fff; font-size: 14px; cursor: pointer;
    }
    #input-bar button:disabled { opacity: 0.5; cursor: not-allowed; }
    .hint { text-align: center; color: #64748b; font-size: 12px; margin-top: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>💼 Java 面试知识库问答</h1>
    <span class="badge">RAG · DeepSeek</span>
  </header>

  <div id="chat">
    <div class="msg assistant">你好!我是基于 RAG 技术的 Java 面试知识库助手。<br>你可以问我任何 Java 相关的问题,比如:<br>• Spring 事务什么时候会失效?<br>• HashMap 底层是怎么实现的?<br>• 什么是缓存雪崩?</div>
  </div>

  <div id="input-bar">
    <input id="q" type="text" placeholder="输入你的 Java 问题... (Enter 发送)" autocomplete="off">
    <button id="send">发送</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('q');
    const sendBtn = document.getElementById('send');

    function appendMsg(role, text, sources) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.textContent = text;
      if (sources && sources.length) {
        const src = document.createElement('div');
        src.className = 'sources';
        src.textContent = '📚 参考来源: ';
        sources.forEach(s => {
          const span = document.createElement('span');
          span.textContent = s;
          src.appendChild(span);
        });
        div.appendChild(src);
      }
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function send() {
      const question = input.value.trim();
      if (!question) return;
      input.value = '';
      sendBtn.disabled = true;

      appendMsg('user', question);
      const loading = appendMsg('assistant', '正在检索知识库并生成回答');
      loading.classList.add('typing');

      try {
        const resp = await fetch('/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, top_k: 3 }),
        });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        loading.classList.remove('typing');
        loading.textContent = data.answer;
        const src = document.createElement('div');
        src.className = 'sources';
        src.textContent = '📚 参考来源: ';
        data.sources.forEach(s => {
          const span = document.createElement('span');
          span.textContent = s;
          src.appendChild(span);
        });
        loading.appendChild(src);
      } catch (e) {
        loading.classList.remove('typing');
        loading.textContent = '请求失败: ' + e.message + '(请确认后端服务已启动)';
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.onclick = send;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
    input.focus();
  </script>
</body>
</html>
